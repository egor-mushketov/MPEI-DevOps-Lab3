services:
  db:
    image: postgis/postgis:17-3.6
    environment:
      POSTGRES_DB: ${PG_DB_NAME:-moscow_events}
      POSTGRES_USER: ${PG_USER_NAME:-postgres}
      POSTGRES_PASSWORD: ${PG_USER_PASSWORD:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  backend:
    image: ghcr.io/nelkor/moscow-events:latest
    environment:
      PG_HOST: db
      PG_PORT: 5432
      PG_DB_NAME: ${PG_DB_NAME:-moscow_events}
      PG_USER_NAME: ${PG_USER_NAME:-postgres}
      PG_USER_PASSWORD: ${PG_USER_PASSWORD:-postgres}
      SEED_MODE: ${SEED_MODE:-sample}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=3).close()"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  pg_data: